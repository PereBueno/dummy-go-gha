name: scan-build-push-ecr
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  push:
    branches:
      - '**'
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  register-artifact:
    uses: cloudbees.io/register-build-artifact
    vars: inherit
    secrets: inherit
    with:
      name: dummy-go-gha
      version: 0.0.1
      url: https://example.test/dummy-go-gha/0.0.1/dummy-go-gha-action