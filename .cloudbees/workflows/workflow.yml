name: scan-build-push-ecr
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  push:
    branches:
      - '**'
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  build-gha:
    uses: calculi-corp/cb-internal-shared-actions/build/action@v8
    vars: inherit
    secrets: inherit
    with:
      run-unit-test: "true"
      go-binary-build: "true"
      kaniko-build: "true"
      go-binary-name: dummy-go-gha
      service-name: dummy-go-gha
      dockerfile-path: Dockerfile
      unit-test-percent: "80"