name: Testing the action
on:
  workflow_dispatch:
  pull_request:
    types:
      - reopened
      - opened
      - synchronize
jobs:
  action-test-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
      - name: Setup Go
        uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: 1.25.7
      - name: Setup GH authentication
        id: gh-auth
        run: echo "machine github.com login ${{ github.actor }} password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
      - name: Build binary
        id: build-binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o dummy-go-gha && \
          chmod +x dummy-go-gha
      - name: register-build-artifact
        id: register_artifact_1
        uses: cloudbees-io-gha/register-build-artifact@v3
        with:
          cloudbees-url: "https://api.saas-preprod.beescloud.com"
          name: h-deployed-artifact-test-1
          url: "docker.io/hdevanan/h-test-artifact-1:1.0.1"
          version: 1.0.1
          label: staging,qa,prod
          type: "docker"
          digest: "sha256:1234567890abcdef123456123456abcdefabcdef123456"
      - name: Register deployed artifact
        uses: ./
        id: register-deployed-artifact
        with:
          cloudbees-url: 'https://api.saas-preprod.beescloud.com'
          artifact-id: some-id
          target-environment: Production
          labels: staging,qa,prod
