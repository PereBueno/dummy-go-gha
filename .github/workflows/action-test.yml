name: Testing the action
on:
  workflow_dispatch:
  pull_request:
    types:
      - reopened
      - opened
      - synchronize
jobs:
  action-test-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
      - name: Setup Go
        uses: actions/setup-go@v5
        id: setup-go
        with:
          go-version: 1.25.7
      - name: Setup GH authentication
        id: gh-auth
        run: echo "machine github.com login ${{ github.actor }} password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
      - name: Build binary
        id: build-binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o gha_register_deployed_artifact_app && \
          chmod +x gha_register_deployed_artifact_app
      - name: Register deployed artifact
        uses: ./
        id: register-deployed-artifact
        with:
          cloudbees-url: 'https://api.saas-preprod.beescloud.com'
          artifact-id: some-id
          target-environment: Production
          labels: staging,qa,prod
